server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # URLs limpas: tenta o arquivo, depois .html, depois diretório.
    # Serve /avaliacao-neuropsicologica a partir de avaliacao-neuropsicologica.html
    # com HTTP 200 direto (sem redirect), casando com as tags canonical.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Assets com hash no nome: cache longo e imutável.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /404.html {
        internal;
    }
    error_page 404 /404.html;

    # Compressão para HTML/CSS/JS/SVG/XML.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/rss+xml;
    gzip_min_length 256;
}
