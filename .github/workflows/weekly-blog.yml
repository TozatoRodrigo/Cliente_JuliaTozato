name: Post semanal do blog

# Toda segunda 09:00 (America/Sao_Paulo = 12:00 UTC) + execução manual.
# Gera 1 post via API da Claude, valida, commita no repo (fonte única), builda
# e publica na VPS — tudo na nuvem, sem depender do Mac.
on:
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

concurrency:
  group: post-semanal
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gerar-e-publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar post
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Opcionais — defina como "Variables" no repo para usar outro provedor
          # compatível (ex.: GLM/Z.ai). Vazios = usa a API da Anthropic.
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: node scripts/generate-blog-post.mjs

      - name: Nada a fazer (backlog esgotado)
        if: steps.gen.outputs.created != 'true'
        run: echo "Nenhum post novo — encerrando sem alterações."

      - name: Validar frontmatter (schema Zod)
        if: steps.gen.outputs.created == 'true'
        run: node automation/validate-blog.mjs

      - name: Commitar o post (fonte única no GitHub)
        if: steps.gen.outputs.created == 'true'
        run: |
          git config user.name "julia-blog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/blog/
          git commit -m "Novo post: ${{ steps.gen.outputs.slug }}"
          git push

      - name: Build
        if: steps.gen.outputs.created == 'true'
        run: npx astro build

      - name: Publicar na VPS
        if: steps.gen.outputs.created == 'true'
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$VPS_USER@$VPS_HOST:/home/rodrigo/apps/site-julia/html/"
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" "cd ~/apps/site-julia && docker compose restart"

      - name: Verificar o post no ar
        if: steps.gen.outputs.created == 'true'
        run: |
          slug="${{ steps.gen.outputs.slug }}"
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 "https://psicologajuliatozato.com.br/blog/$slug" || true)
            if [ "$code" = "200" ]; then echo "post no ar: /blog/$slug"; exit 0; fi
            sleep 3
          done
          echo "AVISO: post ainda não respondeu 200"; exit 1
